spring.application.name=methodologist-setup-service
server.port=8090
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
logging.level.tools.vitruv.methodologist=DEBUG

# uploads: metamodels can easily exceed the 1MB default
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB

# VSUM build (see VsumBuildProperties for all options)
setup.vsum.maven-command=mvn
setup.vsum.build-timeout=15m
setup.vsum.max-concurrent-builds=2
# offline builds with the Maven repository of the Docker image (see Dockerfile)
setup.vsum.offline=false
setup.vsum.online-fallback=true
setup.vsum.infrastructure-retries=1
setup.vsum.maven-opts=-Xmx1g
setup.vsum.min-free-disk-space=1GB
setup.vsum.workspace-retention=1d
setup.vsum.warmup.enabled=false

# /actuator/health/liveness and /actuator/health/readiness; the service is only ready once the
# VSUM build warm-up succeeded (if enabled)
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,vsumBuildWarmup
management.endpoint.health.group.readiness.show-details=always
