services:
  methodologist-setup-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: methodologist-setup-service:latest
    ports:
      - "8090:8090"
    environment:
      JAVA_TOOL_OPTIONS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:InitialRAMPercentage=25.0
    # The Maven repository of the VSUM builds is part of the image (/opt/vsum-m2). Do not mount a
    # volume over it: a named volume is filled from the image only once and would then hide the
    # dependencies of newer images.
    restart: unless-stopped
